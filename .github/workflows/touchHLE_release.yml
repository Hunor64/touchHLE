name: Build touchHLE

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  workflow_dispatch: 

env:
  CARGO_TERM_COLOR: always
  # Fixes the SDL2 build error (Exit 101) by allowing older CMake scripts to run
  CMAKE_ARGS: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # Silences the Node.js deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-osx:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --target x86_64-apple-darwin --release

      - name: Build (aarch64)
        run: cargo build --target aarch64-apple-darwin --release

      - name: Create Universal Binary
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/touchHLE \
            target/x86_64-apple-darwin/release/touchHLE \
            target/aarch64-apple-darwin/release/touchHLE

      - name: Package
        run: |
          mkdir -p touchHLE-dmg-src
          cp target/universal-apple-darwin/release/touchHLE touchHLE-dmg-src/
          cp LICENSE touchHLE-dmg-src/ 2>/dev/null || true
          cp README.md touchHLE-dmg-src/ 2>/dev/null || true
          hdiutil create -volname touchHLE -srcfolder touchHLE-dmg-src -ov -format UDZO touchHLE_macOS_universal.dmg

      - name: Upload macOS Universal
        uses: actions/upload-artifact@v4
        with:
          name: touchHLE_macOS_universal
          path: touchHLE_macOS_universal.dmg

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@v3
        with:
          path: vendor/boost
          key: boost_1_81_0

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download and Extract Boost
        run: |
          curl -L -o boost.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"
          7z -ovendor x boost.7z && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup Android NDK & Rust
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk@3.5.4

      - name: Build for Android
        run: |
          cd android
          # Replace with your specific gradle path if different
          ./gradlew assembleRelease 
          mv app/build/outputs/apk/release/app-release.apk ../touchHLE.apk
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_LATEST_HOME }}

      - uses: actions/upload-artifact@v4
        with:
          name: touchHLE_Android_AArch64
          path: touchHLE.apk

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: cargo build --release
        env:
          CMAKE: cmake

      - name: Create bundle
        shell: bash
        run: cd dev-scripts && ./make-windows-bundle.sh ../target/release/touchHLE.exe && mv touchHLE_windows_bundle/ ..

      - uses: actions/upload-artifact@v4
        with:
          name: touchHLE_Windows_x86_64
          path: touchHLE_windows_bundle/
